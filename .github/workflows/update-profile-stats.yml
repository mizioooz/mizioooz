name: Update profile statistics

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check private statistics access
        id: access
        shell: bash
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [[ -z "$PROFILE_STATS_TOKEN" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "PROFILE_STATS_TOKEN is not configured; keeping the existing aggregate cards."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate current statistics
        if: steps.access.outputs.available == 'true'
        run: node scripts/update-profile-stats.mjs
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: mizioooz

      - name: Publish updated cards
        if: steps.access.outputs.available == 'true'
        run: |
          if git diff --quiet -- assets/stats; then
            echo "Statistics have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/*.svg
          git commit -m "chore: refresh profile statistics"
          git push
