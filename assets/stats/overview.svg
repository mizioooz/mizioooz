<svg xmlns="http://www.w3.org/2000/svg" width="880" height="232" viewBox="0 0 880 232" role="img" aria-labelledby="title desc">
  <title id="title">Статистика GitHub ss-dizarizago</title>
  <desc id="desc">Автоматически сформировано на основе актуальных данных GitHub.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#17102b;#0d1117" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#131a27">
        <animate attributeName="stop-color" values="#131a27;#10243a;#131a27" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#0d2a25;#111827" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#00d084"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.35 0;0.35 0;-0.35 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="878" height="230" rx="22" fill="url(#surface)" stroke="#30363d"/>
  <ellipse cx="770" cy="30" rx="150" ry="85" fill="#6c5ce7" opacity=".13" filter="url(#glow)">
    <animate attributeName="opacity" values=".08;.22;.08" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="740;790;740" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="120" cy="222" rx="120" ry="55" fill="#00d084" opacity=".05" filter="url(#glow)">
    <animate attributeName="opacity" values=".03;.13;.03" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="28" y="26" width="72" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="72;144;72" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="28" y="62" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Dizarizago · GitHub</text>
  <text x="852" y="61" text-anchor="end" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="12">30 авг. 2026 г., 01:57 МСК</text>
  <g transform="translate(28 92)">
    <rect width="190" height="92" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="18" y="36" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">2</text>
    <text x="18" y="65" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">Всего проектов</text>
  </g>
  <g transform="translate(235 92)">
    <rect width="190" height="92" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="18" y="36" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">31</text>
    <text x="18" y="65" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">Коммиты</text>
  </g>
  <g transform="translate(442 92)">
    <rect width="190" height="92" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="18" y="36" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">2</text>
    <text x="18" y="65" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">Получено звёзд</text>
  </g>
  <g transform="translate(649 92)">
    <rect width="190" height="92" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="18" y="36" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">2</text>
    <text x="18" y="65" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">Активные за год</text>
  </g>
  <text x="28" y="210" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="12">Агрегировано по публичным репозиториям · без раскрытия доступа</text>
  <text x="852" y="210" text-anchor="end" fill="#6e7681" font-family="Segoe UI,Arial,sans-serif" font-size="11">Ежедневно в 00:00 МСК (UTC+3)</text>
</svg>
